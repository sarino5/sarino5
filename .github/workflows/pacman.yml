# Generates the Pac-Man contribution-graph animation shown in README.md and pushes it to the `output` branch.
name: Generate Pac-Man

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate the Pac-Man SVGs in './dist/'
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update Pac-Man animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
